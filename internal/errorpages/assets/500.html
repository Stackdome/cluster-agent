<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>500 — Internal error</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A//www.w3.org/2000/svg' viewBox='-60 -60 120 120'%3E%3Cpath d='M -25,50 L -50,25 L -50,-25 L 0,-50 L 50,-25 L 50,25 L 25,50' stroke='%23ff6d31' stroke-width='8' fill='none'/%3E%3C/svg%3E">
<style>
:root{--background:#fefcf9;--foreground:#080808;--muted:#949494;--border:#eae4d7;--brand:#ff6d31}
@media (prefers-color-scheme:dark){:root{--background:#0a0e14;--foreground:#f8f8f8;--muted:#94a3b8;--border:#1f2937}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--background);color:var(--foreground);font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-feature-settings:'ss01','ss02';-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;position:relative;overflow-x:hidden}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.10;color:var(--foreground);background-image:linear-gradient(to right,currentColor 1px,transparent 1px),linear-gradient(to bottom,currentColor 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,black 30%,transparent 80%)}
.brand{position:absolute;top:16px;left:16px;z-index:30;display:inline-flex;align-items:center;gap:10px}
.brand span{font-weight:600;text-transform:lowercase;line-height:1;letter-spacing:.04em;font-size:20px}
main{position:relative;z-index:10;display:flex;min-height:100svh;align-items:center;justify-content:center;padding:0 24px}
.stack{display:flex;max-width:36rem;flex-direction:column;align-items:center;gap:24px;text-align:center}
.eyebrow{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--brand)}
.code{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:120px;font-weight:600;line-height:1;letter-spacing:-.025em;color:var(--brand);-webkit-text-stroke:2px currentColor;-webkit-text-fill-color:transparent}
h1{font-size:28px;font-weight:600;line-height:1.25;letter-spacing:-.025em}
p{max-width:28rem;font-size:14px;line-height:1.625;color:var(--muted)}
.rail{position:absolute;inset-inline:0;bottom:24px;z-index:10;display:flex;justify-content:space-between;padding:0 24px;font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
@media (min-width:640px){.code{font-size:160px}.brand{top:24px;left:24px}.rail{padding:0 40px}}
@media (min-width:1280px){.code{font-size:200px}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<div class="brand">
  <svg width="20" height="20" viewBox="-60 -60 120 120" fill="none" aria-hidden="true">
    <path d="M -25,50 L -50,25 L -50,-25 L 0,-50 L 50,-25 L 50,25 L 25,50" stroke="var(--brand)" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="10" fill="none"/>
    <path d="M -32.5,18 L 0,11 L 32.5,18 L 0,25 Z" fill="#94a3b8"/>
    <path d="M -30,9 L 0,2 L 30,9 L 0,16 Z" fill="#cbd5e1"/>
    <path d="M -27.5,0 L 0,-7 L 27.5,0 L 0,7 Z" fill="currentColor"/>
  </svg>
  <span>stackdome</span>
</div>
<main>
  <div class="stack">
    <div class="eyebrow">Error</div>
    <div class="code">500</div>
    <h1>Something went wrong</h1>
    <p>The application returned an error while handling this request. If you own this app, check its logs in Stackdome for details.</p>
  </div>
</main>
<div class="rail"><span>status: 500</span><span>internal_error</span></div>
</body>
</html>
