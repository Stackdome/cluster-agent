createNamespace: false

image:
  repository: quay.io/stackdome/cluster-agent/cluster-agent-manager
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1
leaderElect: true
platformTLSNamespace: stackdome-control-plane

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Traefik error-page wiring (Service, Middleware, catch-all IngressRoute).
# Off for now. Requires the Traefik CRDs; when enabling, also point both Traefik
# entrypoint middlewares at `<release-namespace>-stackdome-errors@kubernetescrd`.
errorPages:
  enabled: false
