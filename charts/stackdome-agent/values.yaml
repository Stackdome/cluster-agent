stackdome-agent-standalone:
  errorPages:
    enabled: false
  image:
    repository: quay.io/stackdome/cluster-agent/cluster-agent-manager
    tag: ""
  replicaCount: 1
  leaderElect: true
  platformTLSNamespace: stackdome-control-plane
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

cert-manager:
  enabled: true
  crds:
    enabled: false

cloudnative-pg:
  enabled: true

traefik:
  enabled: true
  # Branded error pages are off for now (stackdome-agent-standalone.errorPages.enabled),
  # so no entrypoint middleware is applied. To turn them back on, enable the
  # subchart flag and set both entrypoint middleware references to
  # `<release-namespace>-stackdome-errors@kubernetescrd`. The reference must match
  # the release namespace; templates/validate-error-page-middleware.yaml enforces
  # that, because a middleware that does not resolve fails every router on the
  # entrypoint.

plugin-barman-cloud:
  enabled: true
