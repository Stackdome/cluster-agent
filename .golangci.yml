version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - staticcheck
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - unparam
    - unused
  exclusions:
    # Keep v1's generated-file behavior during the v2 migration.
    generated: lax
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
          - lll

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # The v1 runner was incompatible with Go 1.25, so its existing findings were
  # never an enforceable baseline. Reject issues introduced after this repair.
  new-from-rev: 6c7a654224757b3d458ea51dc3887f43eb6b1a2d
